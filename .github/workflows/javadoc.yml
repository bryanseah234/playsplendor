name: Publish Javadoc to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Javadoc (native toolchain)
        run: |
          rm -rf site
          mkdir -p site/javadoc
          javadoc -d site/javadoc -sourcepath src $(find src -name "*.java")
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=./javadoc/index.html" />
              <title>Splendor Javadoc</title>
            </head>
            <body>
              <p>Redirecting to <a href="./javadoc/index.html">Splendor Javadoc</a>...</p>
            </body>
          </html>
          HTML

      - name: Deploy docs to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
