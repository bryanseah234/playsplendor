name: Documentation Update

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**/*.java'
      - 'docs/diagrams/**/*.puml'
      - 'docs/diagrams/**/*.mmd'
      - 'generate_docs_enhanced.*'
      - '.github/workflows/documentation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**/*.java'
      - 'docs/diagrams/**/*.puml'

  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Javadoc
      run: |
        javadoc -d docs/javadoc -sourcepath src -subpackages com.splendor \
          -encoding UTF-8 -charset UTF-8 -version -author -use -splitindex \
          -windowtitle "Splendor Game API Documentation" \
          -Xdoclint:all -Xdoclint:-missing -quiet

    - name: Cache PlantUML
      id: cache-plantuml
      uses: actions/cache@v4
      with:
        path: docs/diagrams/plantuml.jar
        key: ${{ runner.os }}-plantuml-${{ hashFiles('docs/diagrams/plantuml.jar') }}

    - name: Download PlantUML (if not cached)
      if: steps.cache-plantuml.outputs.cache-hit != 'true'
      run: |
        if [ ! -f docs/diagrams/plantuml.jar ]; then
          curl -L -o docs/diagrams/plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v1.2023.13/plantuml-1.2023.13.jar
        fi

    - name: Generate PlantUML diagrams
      run: |
        mkdir -p docs/diagrams/auto_generated
        for f in docs/diagrams/splendor*.puml docs/diagrams/splendor-*.puml; do
          [ -f "$f" ] && java -jar docs/diagrams/plantuml.jar \
            -SbackgroundColor=#FFFFFF -tpng "$f" -o auto_generated
        done

    - name: Validate Documentation
      run: |
        [ -f docs/javadoc/index.html ] || (echo "Javadoc missing" && exit 1)
        [ -f docs/index.html ]         || (echo "docs/index.html missing" && exit 1)
        echo "Documentation validation complete"
